<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Permutation importance</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<link rel="stylesheet" href="../../lib/viz.css">
<script src="../../lib/viz.js"></script>
<script data-goatcounter="https://johnsanterre.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body>
<div id="stage"></div>
<script>
/* Module 7, feature importance: the notes' permutation importance.
   "1. Evaluate model on validation set 2. Shuffle one feature 3. Measure
   performance drop 4. Large drop = important feature."
   Data (simulated, seeded): four standard-normal features; the label is drawn
   from a logistic model with weights 2.4, 1.3, 0.8 on x1, x2, x3 and 0 on x4,
   so x4 is pure noise. 400 training rows and 400 held-out rows.
   Model: a logistic regression fitted in this page by full-batch gradient
   descent on the log loss (3,000 steps, step size 0.5), the classifier the
   course fits with scikit-learn's LogisticRegression; it predicts filled when
   w.x + b > 0. Score s: held-out accuracy.
   Permutation importance as scikit-learn's permutation_importance computes it:
   for each feature j and each of K = 5 repeats, shuffle column j of the
   held-out set (a seeded Fisher-Yates permutation), rescore, and record the
   drop s - s_kj; the importance is the mean drop. The table shows the first
   ten held-out rows; every number is computed on all 400. The page does not
   show impurity importance: the notes describe it but not its bias toward
   features with many distinct values, so that contrast is left out. */
(function () {
  var V = VIZ, P = V.P;
  var NF = 4, K = 5, N = 400, ROWS = 10;
  var WT = [2.4, 1.3, 0.8, 0], BT = -0.3;

  // simulate
  var r = V.rng(1);
  function sim(n) {
    var X = [], Y = [];
    for (var i = 0; i < n; i++) {
      var x = [], z = BT;
      for (var j = 0; j < NF; j++) { x.push(V.normal(r)); z += WT[j] * x[j]; }
      Y.push(r() < 1 / (1 + Math.exp(-z)) ? 1 : 0); X.push(x);
    }
    return [X, Y];
  }
  var TR = sim(N), XV_ = sim(N), XT = TR[0], YT = TR[1], XV = XV_[0], YV = XV_[1];

  // fit the logistic regression
  var w = [0, 0, 0, 0], b = 0;
  for (var it = 0; it < 3000; it++) {
    var g = [0, 0, 0, 0], gb = 0;
    for (var i = 0; i < N; i++) {
      var z = b; for (var j = 0; j < NF; j++) z += w[j] * XT[i][j];
      var e = 1 / (1 + Math.exp(-z)) - YT[i];
      for (j = 0; j < NF; j++) g[j] += e * XT[i][j]; gb += e;
    }
    for (j = 0; j < NF; j++) w[j] -= 0.5 * g[j] / N; b -= 0.5 * gb / N;
  }
  function pred(x) { var z = b; for (var j = 0; j < NF; j++) z += w[j] * x[j]; return z > 0 ? 1 : 0; }
  function score(col, perm) {                                     // held-out accuracy with column col permuted
    var c = 0;
    for (var i = 0; i < N; i++) {
      var x = XV[i].slice(); if (perm) x[col] = XV[perm[i]][col];
      c += pred(x) === YV[i] ? 1 : 0;
    }
    return c / N;
  }
  var S = score();
  var PERM = [], DROP = [], IMP = [];                             // PERM[j][k], DROP[j][k] = s - s_kj
  for (j = 0; j < NF; j++) {
    PERM.push([]); DROP.push([]);
    for (var k = 0; k < K; k++) {
      var p = []; for (i = 0; i < N; i++) p.push(i);
      for (i = N - 1; i > 0; i--) { var q = Math.floor(r() * (i + 1)), tmp = p[i]; p[i] = p[q]; p[q] = tmp; }
      PERM[j].push(p); DROP[j].push(S - score(j, p));
    }
    IMP.push(DROP[j].reduce(function (a, c) { return a + c; }, 0) / K);
  }

  // layout
  var CX = [235, 375, 515, 655], CY = 800, CH = 905;               // column centres: x1..x4, y, y-hat
  var TY0 = 418, RH = 41, TOP = TY0 + 46;                          // header baseline, row height, first row baseline
  var BX0 = 250, BSC = 1700, BY = [1135, 1205, 1275, 1345];         // bars: zero at BX0, px per unit of drop
  // timeline: per feature, a slow first shuffle, four fast repeats, then the column restored
  var T0 = 1.5, PER = 4.0, DUR = T0 + NF * PER + 2.4;
  function events(j) {                                             // [start, duration, from state, to state]; state -1 = unshuffled
    var s = T0 + j * PER, ev = [[s + 0.35, 0.8, -1, 0]];
    for (var k = 1; k < K; k++) ev.push([s + 1.75 + 0.36 * (k - 1), 0.26, k - 1, k]);
    ev.push([s + 3.25, 0.5, K - 1, -1]);
    return ev;
  }
  var EV = []; for (j = 0; j < NF; j++) EV.push(events(j));
  function activeCol(t) { return V.clamp(Math.floor((t - T0) / PER), 0, NF - 1); }
  // the column's displayed state at t: from, to, eased progress
  function colState(j, t) {
    var ev = EV[j], cur = null;
    ev.forEach(function (e) { if (t >= e[0]) cur = e; });
    if (!cur) return { from: -1, to: -1, u: 1 };
    return { from: cur[2], to: cur[3], u: V.span(t, cur[0], cur[0] + cur[1]) };
  }
  function cell(j, state, i) { return state < 0 ? XV[i][j] : XV[PERM[j][state][i]][j]; }
  function fmt(v, d) { var s = Math.abs(v).toFixed(d); return (v < 0 && +s !== 0 ? "−" : "") + s; }
  // repeats of feature j revealed by time t, each with its eased appearance
  function revealed(j, t) {
    var out = [];
    for (var k = 0; k < K; k++) {
      var e = EV[j][k], a = V.span(t, e[0] + e[1] * 0.6, e[0] + e[1] * 0.6 + 0.35);
      if (a > 0) out.push([DROP[j][k], a]);
    }
    return out;
  }

  var eq, counter, cap, readout, hdr = [], barLab = [], barVal = [], more;
  function setup() {
    eq = V.el("eq", "");
    eq.innerHTML = "<div>" + katex.renderToString("I_j = s - \\tfrac{1}{K}\\textstyle\\sum_{k=1}^{K} s_{k,j}") + "</div>" +
      '<div style="color:' + P.amber + '">' + katex.renderToString("s_{k,j}\\text{: held-out accuracy with column } j \\text{ shuffled},\\ K = 5") + "</div>";
    counter = V.el("counter", "");
    cap = V.el("caption", "A logistic regression fitted in the page to 400 simulated rows. Shuffling a column breaks its link to $y$; the accuracy lost is that feature's importance. Here $x_4$ is pure noise.");
    ["$x_1$", "$x_2$", "$x_3$", "$x_4$", "$y$", "$\\hat y$"].forEach(function (s, c) {
      var x = c < 4 ? CX[c] : c === 4 ? CY : CH;
      hdr.push(V.el("label", s, { left: (x - 40) + "px", width: "80px", textAlign: "center", top: (TY0 - 30) + "px", color: P.ink }));
    });
    more = V.el("label", "⋮  first 10 of 400 held-out rows", { left: "150px", top: (TOP + ROWS * RH - 14) + "px" });
    readout = V.el("label", "", { left: "0", right: "0", textAlign: "center", top: "958px", color: P.ink, fontSize: "34px" });
    for (var j = 0; j < NF; j++) {
      barLab.push(V.el("label", "$x_" + (j + 1) + "$", { right: (1080 - BX0 + 44) + "px", top: (BY[j] - 19) + "px", color: P.ink }));
      barVal.push(V.el("label", "", { top: (BY[j] - 17) + "px" }));
    }
    V.el("label", "importance: mean drop in held-out accuracy", { left: BX0 + "px", top: (BY[0] - 76) + "px" });
  }

  function render(t, ctx) {
    var intro = V.span(t, 0, 0.8), J = activeCol(t);
    ctx.save(); ctx.globalAlpha = intro;
    var fam = getComputedStyle(document.getElementById("stage")).fontFamily;

    // the shuffled column's highlight
    var st = T0 + J * PER, hl = V.span(t, st, st + 0.35) * (1 - V.span(t, st + 3.75, st + 4.0));
    if (t >= T0 && hl > 0) {
      ctx.fillStyle = V.rgba(P.form, hl);
      ctx.fillRect(CX[J] - 62, TY0 - 40, 124, 56 + ROWS * RH);
    }
    // header rule and the rule between the features and the labels
    V.line(ctx, 160, TY0 + 14, 960, TY0 + 14, P.hair, 1.5);
    V.line(ctx, (CX[3] + CY) / 2, TY0 - 36, (CX[3] + CY) / 2, TOP + (ROWS - 1) * RH + 12, P.hair, 1.5);

    // cells: an unshuffled column holds still; the shuffled one rolls from one state to the next
    ctx.textAlign = "right"; ctx.font = "400 28px " + fam;
    var state = [];
    for (var j = 0; j < NF; j++) {
      var cs = colState(j, t); state.push(cs.u > 0.5 ? cs.to : cs.from);
      for (var i = 0; i < ROWS; i++) {
        var y = TOP + i * RH, xr = CX[j] + 42;
        if (cs.u >= 1 || cs.from === cs.to) {
          ctx.fillStyle = P.ink; ctx.fillText(fmt(cell(j, cs.to, i), 2), xr, y);
        } else {
          var lag = V.ease(V.clamp(cs.u * 1.3 - i * 0.03, 0, 1));   // a small stagger down the column
          ctx.save(); ctx.beginPath(); ctx.rect(CX[j] - 62, y - 30, 124, RH); ctx.clip();   // each cell rolls inside its own row
          ctx.fillStyle = P.ink;
          ctx.fillText(fmt(cell(j, cs.from, i), 2), xr, y - RH * lag);
          ctx.fillText(fmt(cell(j, cs.to, i), 2), xr, y + RH * (1 - lag));
          ctx.restore();
        }
      }
    }
    // y and the prediction for each shown row under the current columns; a cross marks a wrong prediction
    for (i = 0; i < ROWS; i++) {
      y = TOP + i * RH - 9;
      var x = []; for (j = 0; j < NF; j++) x.push(cell(j, state[j], i));
      var yh = pred(x);
      function mark(cx, c) {
        if (c) V.dot(ctx, cx, y, P.ink, 8);
        else { V.dot(ctx, cx, y, P.ground, 8); V.ring(ctx, cx, y, 7, P.ink, 2.5); }
      }
      mark(CY, YV[i]); mark(CH - 14, yh);
      if (yh !== YV[i]) {
        V.line(ctx, CH + 12, y - 8, CH + 28, y + 8, P.ink, 2.5); V.line(ctx, CH + 12, y + 8, CH + 28, y - 8, P.ink, 2.5);
      }
    }

    // the readout: held-out accuracy, and after a shuffle what it fell to
    var sj = -1;
    for (j = 0; j < NF; j++) if (state[j] >= 0) sj = j;
    if (sj < 0) V.tex(readout, "held-out accuracy  $s = " + S.toFixed(3) + "$");
    else V.tex(readout, "$x_" + (sj + 1) + "$ shuffled:  accuracy " + S.toFixed(3) + " → " + (S - DROP[sj][state[sj]]).toFixed(3));

    // bars: the mean drop over the repeats so far, each repeat an open mark on its row
    V.line(ctx, BX0, BY[0] - 32, BX0, BY[NF - 1] + 32, P.hair, 1.5);
    for (j = 0; j < NF; j++) {
      var rv = revealed(j, t);
      if (!rv.length) { barVal[j].style.opacity = 0; continue; }
      var sum = 0, wsum = 0;
      rv.forEach(function (d, n) { var wt = n === rv.length - 1 ? d[1] : 1; sum += d[0] * wt; wsum += wt; });
      var mean = sum / Math.max(wsum, 1e-9), len = mean * BSC * (rv.length === 1 ? rv[0][1] : 1);
      var x0 = Math.min(BX0, BX0 + len), wdt = Math.abs(len);
      ctx.fillStyle = P.form; ctx.fillRect(x0, BY[j] - 22, wdt, 44);
      ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.strokeRect(x0, BY[j] - 22, Math.max(wdt, 1), 44);
      rv.forEach(function (d) {
        var xx = BX0 + d[0] * BSC;
        V.dot(ctx, xx, BY[j], V.rgba(P.ground, d[1]), 6); V.ring(ctx, xx, BY[j], 6, V.rgba(P.ink, d[1]), 2);
      });
      var done = V.span(t, EV[j][K - 1][0] + 0.4, EV[j][K - 1][0] + 0.8);
      var maxX = BX0 + Math.max(0, Math.max.apply(null, rv.map(function (d) { return d[0]; })) * BSC, len);
      barVal[j].style.left = (maxX + 22) + "px"; barVal[j].style.opacity = intro;
      barVal[j].style.color = P.ink;
      barVal[j].textContent = fmt(rv.length < K ? mean : IMP[j], 3) + (j === NF - 1 && done > 0.5 ? "   pure noise" : "");
    }
    ctx.restore();

    V.tex(counter, t < T0 ? "$\\text{shuffle: none}$" : "$\\text{shuffle } x_" + (J + 1) + "$");
  }

  VIZ.run({ duration: DUR, poster: DUR - 0.4, setup: setup, render: render,
            title: "Permutation importance", mark: "DATASCI 207", course: "module 7" });
})();
</script>
</body></html>
