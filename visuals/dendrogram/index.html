<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agglomerative clustering</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<link rel="stylesheet" href="../../lib/viz.css">
<script src="../../lib/viz.js"></script>
<script data-goatcounter="https://johnsanterre.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head><body>
<div id="stage"></div>
<script>
/* Module 8, hierarchical clustering. Twelve simulated points (seeded) in three
   groups. Ward linkage, the method the notes call often best, merges at each
   step the pair of clusters whose union adds the least within-cluster sum of
   squares, Delta(A,B); the dendrogram grows below, each link drawn at height
   sqrt(2 Delta), the convention SciPy uses. Then a horizontal cut (amber)
   climbs the tree one gap at a time, the clusters it defines are redrawn, and
   the loop settles on the widest gap: three clusters. */
(function () {
  var V = VIZ, P = V.P;
  var SCX = 540, SCY = 650, SS = 108;                  // scatter centre and pixels per unit
  var DX0 = 150, DX1 = 930, DBASE = 1352, DTOP = 1010;  // dendrogram box
  var PAD = 17;

  // simulate twelve points in three groups of 5, 4 and 3
  var r = V.rng(2081), CEN = [[-2.4, 0.9], [2.2, 1.3], [0.2, -1.6]], SIZES = [5, 4, 3], X = [];
  CEN.forEach(function (c, g) { for (var i = 0; i < SIZES[g]; i++) X.push([c[0] + 0.45 * V.normal(r), c[1] + 0.45 * V.normal(r)]); });
  var N = X.length;

  // Ward agglomeration: merge the pair with the smallest increase in within-cluster sum of squares
  var nodes = X.map(function (p, i) { return { id: i, mem: [i], mu: p.slice(), h: 0 }; });
  var live = nodes.slice(), merges = [];
  while (live.length > 1) {
    var best = null;
    for (var a = 0; a < live.length; a++) for (var b = a + 1; b < live.length; b++) {
      var A = live[a], B = live[b], na = A.mem.length, nb = B.mem.length;
      var d2 = Math.pow(A.mu[0] - B.mu[0], 2) + Math.pow(A.mu[1] - B.mu[1], 2), D = na * nb / (na + nb) * d2;
      if (!best || D < best.D) best = { a: A, b: B, D: D };
    }
    var na2 = best.a.mem.length, nb2 = best.b.mem.length;
    var node = { id: nodes.length, l: best.a, r: best.b, mem: best.a.mem.concat(best.b.mem), D: best.D, h: Math.sqrt(2 * best.D),
      mu: [(na2 * best.a.mu[0] + nb2 * best.b.mu[0]) / (na2 + nb2), (na2 * best.a.mu[1] + nb2 * best.b.mu[1]) / (na2 + nb2)] };
    nodes.push(node); merges.push(node);
    live = live.filter(function (n) { return n !== best.a && n !== best.b; }); live.push(node);
  }
  var root = merges[merges.length - 1], HMAX = root.h;

  // leaf order from the tree; points are lettered in that order so the leaves read a to l
  var order = [];
  (function walk(n) { if (n.l) { walk(n.l); walk(n.r); } else order.push(n.id); })(root);
  var LETTER = {};
  order.forEach(function (id, k) { LETTER[id] = String.fromCharCode(97 + k); nodes[id].x = DX0 + (DX1 - DX0) * k / (N - 1); });
  merges.forEach(function (n) { n.x = (n.l.x + n.r.x) / 2; });
  function hy(h) { return DBASE - (DBASE - DTOP) * h / HMAX; }

  function sx(p) { return SCX + SS * p[0]; }
  function sy(p) { return SCY - SS * p[1]; }

  // clusters after the first m merges
  function clustersAfter(m) {
    var cl = X.map(function (_, i) { return nodes[i]; });
    for (var j = 0; j < Math.min(m, merges.length); j++) { var n = merges[j]; cl = cl.filter(function (c) { return c !== n.l && c !== n.r; }); cl.push(n); }
    return cl;
  }

  function hullsOf(ctx, cl, alpha) { V.hulls(ctx, cl.map(function (c) { return c.mem.map(function (i) { return [sx(X[i]), sy(X[i])]; }); }), PAD, alpha); }
  function topY(n) { return n.l ? hy(n.h) : DBASE; }
  // one link of the tree, drawn in by progress g: the two legs rise, then the bar joins them
  function link(ctx, n, color, g) {
    if (g <= 0) return;
    var y = hy(n.h), gl = V.clamp(g / 0.6, 0, 1), gb = V.clamp((g - 0.6) / 0.4, 0, 1);
    [n.l, n.r].forEach(function (c) { var y0 = topY(c); V.line(ctx, c.x, y0, c.x, V.lerp(y0, y, gl), color, 3); });
    if (gb > 0) { V.line(ctx, n.l.x, y, V.lerp(n.l.x, n.x, gb), y, color, 3); V.line(ctx, n.r.x, y, V.lerp(n.r.x, n.x, gb), y, color, 3); }
  }

  // timeline: eleven merges, slow then faster, the last two slower again; then the cut climbs the tree
  var MD = [1.4, 1.2, 1.0, 0.85, 0.75, 0.7, 0.7, 0.7, 0.8, 1.05, 1.25], MS = [], tt = 0.9;
  MD.forEach(function (d) { MS.push(tt); tt += d; });
  var T_CUT = tt + 0.6, STEP = 0.56, T_RET = T_CUT + 0.5 + (N - 1) * STEP, T_HOLD = T_RET + 1.3, DUR = T_HOLD + 2.4;
  // the cut height for k clusters: halfway between the merge heights on either side
  function cutH(k) {
    var m = N - k;
    if (m === 0) return merges[0].h / 2;
    if (m === N - 1) return HMAX + 0.11 * HMAX;
    return (merges[m - 1].h + merges[m].h) / 2;
  }
  var KFINAL = 3;

  var eq, counter, cap, lw, lcut;
  function setup() {
    var T = "\\textcolor{" + P.teal + "}", A = "\\textcolor{" + P.amber + "}", C = "\\textcolor{" + P.coral + "}";
    eq = V.el("eq", "");
    eq.innerHTML = "<div>" + katex.renderToString(T + "{\\Delta(A,B) = \\frac{|A|\\,|B|}{|A|+|B|}\\,\\lVert \\mu_A - \\mu_B \\rVert^2}") + "</div>" +
      "<div>" + katex.renderToString(A + "{\\text{cut at height } h} \\;\\Rightarrow\\; " + C + "{k} \\text{ clusters}") + "</div>";
    counter = V.el("counter", "");
    cap = V.el("caption", "Twelve simulated points. Ward linkage merges the pair whose union adds the least within-cluster sum of squares. A cut across the tree gives the clusters.");
    lw = V.el("label", "Ward linkage, height $\\sqrt{2\\Delta}$", { left: DX0 + "px", top: (DTOP - 74) + "px" });
    lcut = V.el("label", "cut", { color: P.amber });
  }

  function render(t, ctx) {
    var intro = V.span(t, 0, 0.9);
    var k, cutY = null, cutA = 0, clA, clB, mix = 1, mergeing = -1, mg = 0;

    if (t < T_CUT) {
      // merge phase: how many merges are complete, and the one in progress
      var done = 0;
      for (var j = 0; j < MD.length; j++) if (t >= MS[j] + MD[j] * 0.85) done = j + 1;
      for (var j2 = 0; j2 < MD.length; j2++) if (t >= MS[j2] && t < MS[j2] + MD[j2]) { mergeing = j2; mg = (t - MS[j2]) / MD[j2]; }
      k = N - done;
      var base = mergeing >= 0 ? mergeing : done;
      clA = clustersAfter(base); clB = clustersAfter(base + 1);
      mix = mergeing >= 0 ? V.span(mg, 0.55, 0.9) : 0;
      if (mergeing < 0) clA = clustersAfter(done);
    } else {
      // cut phase: the cut steps up through every gap, then returns to the widest one
      var u = t - T_CUT, kNow, kPrev, g;
      cutA = V.span(t, T_CUT, T_CUT + 0.5);
      if (t < T_RET) {
        var s = Math.max(0, (u - 0.5) / STEP), i = Math.floor(s);
        kPrev = N - Math.min(i, N - 1); kNow = N - Math.min(i + 1, N - 1);
        g = u < 0.5 ? 0 : V.span(s - i, 0, 0.55);
        if (i >= N - 1) { kPrev = kNow = 1; g = 1; }
      } else { kPrev = 1; kNow = KFINAL; g = V.span(t, T_RET, T_HOLD); }
      var hh = V.lerp(cutH(kPrev), cutH(kNow), g);
      cutY = hy(hh);
      k = g > 0.5 ? kNow : kPrev;
      clA = clustersAfter(N - kPrev); clB = clustersAfter(N - kNow); mix = V.span(g, 0.2, 0.8);
    }

    // scatter: cluster forms, then the merge connector, then the points
    ctx.save(); ctx.globalAlpha = intro;
    hullsOf(ctx, clA.filter(function (c) { return clB.indexOf(c) >= 0; }), 1);
    hullsOf(ctx, clA.filter(function (c) { return clB.indexOf(c) < 0; }), 1 - mix);
    hullsOf(ctx, clB.filter(function (c) { return clA.indexOf(c) < 0; }), mix);
    ctx.restore();
    if (mergeing >= 0) {
      var n = merges[mergeing], cg = V.span(mg, 0, 0.4), fade = 1 - V.span(mg, 0.8, 1);
      var p0 = [sx(n.l.mu), sy(n.l.mu)], p1 = [sx(n.r.mu), sy(n.r.mu)];
      V.line(ctx, p0[0], p0[1], V.lerp(p0[0], p1[0], cg), V.lerp(p0[1], p1[1], cg), V.rgba(P.teal, 0.6 * fade), 3, [8, 8]);
    }
    X.forEach(function (p, i) {
      V.dot(ctx, sx(p), sy(p), V.rgba(P.teal, intro), 8);
      V.text(ctx, LETTER[i], sx(p) + 14, sy(p) - 12, V.rgba(P.dim, intro), 26);
    });

    // dendrogram: links grown so far; in the cut phase, teal below the cut and dim above it
    var shownMerges = t < T_CUT ? merges.filter(function (n, j) { return t >= MS[j]; }) : merges;
    function drawTree(color, below) {
      shownMerges.forEach(function (n) {
        var j = merges.indexOf(n), g = t < T_CUT ? V.span(t, MS[j], MS[j] + MD[j] * 0.85) : 1;
        link(ctx, n, color, g);
      });
    }
    if (cutY === null) drawTree(P.teal);
    else {
      drawTree(V.rgba(P.dim, 0.55));
      ctx.save(); ctx.beginPath(); ctx.rect(0, cutY, 1080, DBASE - cutY + 4); ctx.clip(); drawTree(P.teal); ctx.restore();
      V.line(ctx, DX0 - 50, cutY, DX1 + 50, cutY, V.rgba(P.amber, cutA), 3, [8, 8]);
      lcut.style.left = (DX0 - 62) + "px"; lcut.style.top = (cutY - 42) + "px";
    }
    V.fade(lcut, cutY === null ? 0 : cutA);
    order.forEach(function (id) {
      var nd = nodes[id];
      V.dot(ctx, nd.x, DBASE, V.rgba(P.teal, intro), 6);
      V.text(ctx, LETTER[id], nd.x, DBASE + 42, V.rgba(P.dim, intro), 26, "center");
    });

    V.tex(counter, "$k = " + k + "$");
  }

  VIZ.run({ duration: DUR, poster: DUR - 0.4, setup: setup, render: render,
            title: "Agglomerative clustering", mark: "DATASCI 207", course: "module 8" });
})();
</script>
</body></html>
